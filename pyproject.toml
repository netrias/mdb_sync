[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdb-sync"
version = "0.1.0"
description = "Initial client for reading model metadata from the MDB Simple Terminology Server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.29,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[project.scripts]
mdb-sync = "mdb_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdb_sync"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "standard"

